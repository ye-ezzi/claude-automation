service:
  name: "내 브랜드"
  desc: "브랜드 한 줄 설명"
  label: "채널명"

# 기획법 정의 (노션 원본 기준)
frameworks:
  HIRA:
    name: "HIRA"
    structure: ["Hook", "Interest Loop", "Reveal", "Action"]
    desc: "2026 인스타 알고리즘에 가장 잘 맞는 구조. 체류시간·저장·공유를 한 번에 잡는 메인 공식"
    purpose: "체류시간 극대화 + 저장·공유 동시 유도"
    best_for: "마케팅 / 브랜딩 / 교육 / 정보형"
  PAF:
    name: "PAF"
    structure: ["Problem", "Agitation", "Fix"]
    desc: "손해 회피 심리를 자극하는 구조. 댓글·공유 반응이 강하게 터짐"
    purpose: "문제 인식 강화 + 행동 변화 유도"
    best_for: "다이어트 / 헬스 / 자기계발"
  MRC:
    name: "MRC"
    structure: ["Myth", "Reality", "Conclusion"]
    desc: "상식을 깨는 반전 구조. 저장률이 유독 높게 나옴"
    purpose: "인식 전환 + 전문가 포지셔닝"
    best_for: "금융 / 투자 / 헬스 정보 / 마케팅 인사이트"
  BAD:
    name: "BAD"
    structure: ["Before", "After", "Difference"]
    desc: "변화 전후가 명확한 성과형 공식. 팔로우 전환에 특히 강함"
    purpose: "신뢰 확보 + 팔로우 전환"
    best_for: "마케팅 성과 / 다이어트 / 성과 기반 콘텐츠"
  QQA:
    name: "QQA"
    structure: ["Question", "Question", "Answer"]
    desc: "질문으로 스와이프를 끌어내는 구조. 체류시간이 유독 길게 나옴"
    purpose: "궁금증 유발 + 넘김 유도"
    best_for: "교육 / 지식 계정 / 마케팅·전략"
  SCS:
    name: "SCS"
    structure: ["Situation", "Conflict", "Solution"]
    desc: "스토리텔링 기반 공식. 감정 이입이 자연스럽게 일어남"
    purpose: "신뢰 형성 + 브랜드 서사 구축"
    best_for: "퍼스널 브랜딩 / 스타트업 / 창업"
  LES:
    name: "LES"
    structure: ["List", "Explanation", "Summary"]
    desc: "저장률이 가장 높게 나오는 실용 공식"
    purpose: "정보 정리 + 체크리스트 제공"
    best_for: "헬스 / 식단 / 업무·툴 정리"
  FRF:
    name: "FRF"
    structure: ["Fact", "Reason", "Framework"]
    desc: "실제 성과로 신뢰를 만드는 전문가 공식"
    purpose: "전문성 증명 + 신뢰 확보"
    best_for: "컨설팅 / 마케팅 전략 / 데이터 기반 계정"
  EME:
    name: "EME"
    structure: ["Experience", "Meaning", "Expansion"]
    desc: "팔로워를 팬으로 만드는 공식"
    purpose: "공감 형성 + 팬화"
    best_for: "퍼스널 브랜딩 / 코치 / 강사"
  TWH:
    name: "TWH"
    structure: ["This", "Why", "How"]
    desc: "짧고 강하게 핵심을 전달하는 공식"
    purpose: "신규 유입 + 빠른 이해"
    best_for: "정보 요약형 / 신규 계정 / 빠른 메시지 전달"
  HOS:
    name: "HOS"
    structure: ["Hook", "Offer", "Solution"]
    desc: "판매형 구조. 제안을 먼저 던지고 솔루션으로 설득"
    purpose: "전환율 극대화 + 구매/신청 유도"
    best_for: "제품/서비스 소개 / 판매형 콘텐츠"
  PASO:
    name: "PASO"
    structure: ["Problem", "Agitate", "Solution", "Offer"]
    desc: "문제를 자극하고 해결책과 제안으로 전환시키는 구조"
    purpose: "전환율 높은 설득 구조"
    best_for: "서비스 전환 / 구매 유도 / 강의 홍보"

channels:
  AI트렌드:
    sheet_tab: "AI트렌드"
    target: "프리랜서, 크리에이터"
    tone: "친근하고 실용적, 어렵지 않게"
    topic_guide: "OpenAI(ChatGPT·DALL-E·Sora)·Anthropic(Claude)·Google(Gemini·NotebookLM)·Microsoft(Copilot)·Meta(Llama)·Midjourney·Runway·Perplexity 등 생성형 AI 툴 중심으로 다룰 것. 점유율 상위 5개 또는 그 주 가장 핫한 생성형 AI 툴 1개를 키워드로 사용. 디자인 툴(Figma, Canva 등) 키워드는 사용하지 말 것."
    card01_fields:
      - name: "헤드라인"
        desc: "3줄 헤드라인, 각 줄 7~12자 (줄바꿈은 \\n)"
      - name: "컬러칩"
        desc: "콘텐츠 관련 해시태그 (예: #AI자동화 #크리에이터)"
    body_cards: 4
    body_fields:
      - name: "인풋텍스트"
        desc: "본문, 60자 이내"
      - name: "섹션타이틀"
        desc: "소제목, 15자 이내"

  재테크:
    sheet_tab: "재테크"
    target: "결혼 전후 2030 직장인"
    tone: "신뢰감 있고 구체적, 숫자 중심"
    card01_fields:
      - name: "컬러칩"
        desc: "재테크 관련 해시태그 (예: #부수입 #절세전략)"
      - name: "헤드라인"
        desc: "3줄 헤드라인, 각 줄 7~12자 (줄바꿈은 \\n)"
    body_cards: 4
    body_fields:
      - name: "섹션타이틀"
        desc: "소제목, 15자 이내"
      - name: "섹션텍스트"
        desc: "섹션 설명, 30자 이내"
      - name: "키워드"
        desc: "이 섹션 핵심 키워드 (예: #통장쪼개기)"
      - name: "인풋텍스트"
        desc: "본문, 60자 이내"

  마케팅:
    sheet_tab: "마케팅"
    target: "1인 크리에이터, 1인 비즈니스 준비생"
    tone: "동기부여, 행동 유도형"
    card01_fields:
      - name: "키워드"
        desc: "핵심 키워드/해시태그 (예: #마케팅전략)"
      - name: "컬러칩"
        desc: "서브 키워드 (예: #콘텐츠마케팅)"
      - name: "헤드라인"
        desc: "3줄 헤드라인, 각 줄 7~12자 (줄바꿈은 \\n)"
    body_cards: 4
    body_fields:
      - name: "섹션타이틀"
        desc: "소제목, 15자 이내"
      - name: "인풋텍스트"
        desc: "본문, 60자 이내"

