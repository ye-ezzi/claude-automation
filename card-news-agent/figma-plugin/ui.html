<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>카드뉴스 Figma 적용</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
    font-size: 12px;
    background: #fff;
    color: #1e1e1e;
    padding: 16px;
  }
  h1 { font-size: 14px; font-weight: 700; margin-bottom: 14px; }
  .field { margin-bottom: 12px; }
  label { display: block; font-weight: 600; margin-bottom: 4px; color: #444; }
  select {
    width: 100%;
    padding: 7px 8px;
    border: 1px solid #d0d0d0;
    border-radius: 4px;
    font-size: 12px;
    background: #fafafa;
    outline: none;
  }
  select:focus { border-color: #18a0fb; background: #fff; }
  select:disabled { background: #f0f0f0; color: #aaa; }
  .btn {
    width: 100%;
    padding: 10px;
    margin-top: 14px;
    background: #18a0fb;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn:hover { background: #0d8de3; }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  #status {
    margin-top: 10px;
    font-size: 11px;
    color: #666;
    min-height: 16px;
    text-align: center;
    line-height: 1.5;
  }
  #status.error { color: #e53e3e; }
  #status.success { color: #38a169; }
</style>
</head>
<body>

<h1>카드뉴스 Figma 적용</h1>

<div class="field">
  <label>채널</label>
  <select id="channel" onchange="loadFolders()">
    <option value="">채널 선택...</option>
  </select>
</div>

<div class="field">
  <label>주제 (폴더명)</label>
  <select id="folder" disabled>
    <option value="">채널을 먼저 선택하세요</option>
  </select>
</div>

<button class="btn" id="btn" onclick="applyToFigma()" disabled>Figma에 적용</button>
<div id="status">서버 연결 중...</div>

<script>
const SERVER = 'http://localhost:8000';

async function init() {
  try {
    const res = await fetch(`${SERVER}/config`);
    if (!res.ok) throw new Error();
    const data = await res.json();

    const sel = document.getElementById('channel');
    sel.innerHTML = '<option value="">채널 선택...</option>';
    (data.channels || []).forEach(ch => {
      const opt = document.createElement('option');
      opt.value = ch;
      opt.textContent = ch;
      sel.appendChild(opt);
    });

    setStatus('✅ 서버 연결됨', 'success');
  } catch {
    setStatus('❌ 서버 연결 실패\npython3 server.py 실행 확인', 'error');
  }
}

async function loadFolders() {
  const channel = document.getElementById('channel').value;
  const folderSel = document.getElementById('folder');
  const btn = document.getElementById('btn');

  folderSel.disabled = true;
  btn.disabled = true;
  folderSel.innerHTML = '<option value="">불러오는 중...</option>';

  if (!channel) {
    folderSel.innerHTML = '<option value="">채널을 먼저 선택하세요</option>';
    return;
  }

  try {
    const res = await fetch(`${SERVER}/rows?channel=${encodeURIComponent(channel)}`);
    if (!res.ok) throw new Error('시트 읽기 실패');
    const rows = await res.json();

    folderSel.innerHTML = '<option value="">주제 선택...</option>';
    rows.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r['폴더명'];
      opt.textContent = r['폴더명'];
      folderSel.appendChild(opt);
    });

    folderSel.disabled = false;
    folderSel.onchange = () => {
      btn.disabled = !folderSel.value;
    };
    setStatus(`${rows.length}개 항목 로드됨`, 'success');
  } catch (e) {
    folderSel.innerHTML = '<option value="">불러오기 실패</option>';
    setStatus(`❌ ${e.message}`, 'error');
  }
}

async function applyToFigma() {
  const channel = document.getElementById('channel').value;
  const folder = document.getElementById('folder').value;
  const btn = document.getElementById('btn');

  if (!channel || !folder) return;

  btn.disabled = true;
  setStatus('⏳ 시트에서 데이터 가져오는 중...', '');

  try {
    const res = await fetch(
      `${SERVER}/row?channel=${encodeURIComponent(channel)}&folder=${encodeURIComponent(folder)}`
    );
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || '데이터 불러오기 실패');
    }
    const data = await res.json();

    parent.postMessage({ pluginMessage: { type: 'fill-frames', data } }, '*');
    setStatus('✅ Figma 프레임에 적용 완료!', 'success');
  } catch (e) {
    setStatus(`❌ ${e.message}`, 'error');
  } finally {
    btn.disabled = false;
  }
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls;
}

init();
</script>
</body>
</html>
