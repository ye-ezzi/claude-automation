<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
    font-size: 12px;
    background: #fff;
    color: #1e1e1e;
    padding: 16px;
  }
  h1 { font-size: 14px; font-weight: 700; margin-bottom: 14px; }
  .info {
    background: #f0f6ff;
    border: 1px solid #c7deff;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 14px;
    font-size: 11px;
    color: #1a5fb4;
    line-height: 1.6;
  }
  .btn {
    width: 100%;
    padding: 11px;
    background: #18a0fb;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn:hover { background: #0d8de3; }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  #status {
    margin-top: 10px;
    font-size: 11px;
    color: #666;
    min-height: 16px;
    text-align: center;
    line-height: 1.5;
  }
  #status.error { color: #e53e3e; }
  #status.ok { color: #38a169; }
</style>
</head>
<body>

<h1>카드뉴스 자동생성</h1>

<div class="info" id="info">채널 감지 중...</div>

<button class="btn" id="btn" onclick="generate()" disabled>생성하기</button>
<div id="status"></div>

<script>
const SERVER = 'http://localhost:8000';
let currentChannel = '';
let cachedData = null;

window.onmessage = async (event) => {
  const msg = event.data.pluginMessage;
  if (!msg || msg.type !== 'page-name') return;

  currentChannel = msg.name;

  try {
    const res = await fetch(`${SERVER}/approved-rows?channel=${encodeURIComponent(currentChannel)}`);
    if (!res.ok) throw new Error('서버 오류');
    cachedData = await res.json();
    const count = cachedData.rows.length;

    document.getElementById('info').textContent =
      `채널: ${currentChannel}\n완료된 항목: ${count}개`;
    document.getElementById('btn').disabled = count === 0;
    setStatus(count === 0 ? '완료된 항목이 없습니다.' : '');
  } catch (e) {
    document.getElementById('info').textContent = `채널: ${currentChannel}`;
    setStatus('python3 server.py 실행 확인', 'error');
  }
};

async function generate() {
  if (!cachedData) return;
  document.getElementById('btn').disabled = true;
  setStatus('마스터 프레임 복제 중...');

  parent.postMessage({
    pluginMessage: {
      type: 'generate',
      rows: cachedData.rows,
      fieldOrder: cachedData.fieldOrder
    }
  }, '*');

  setStatus('생성 완료!', 'ok');
  document.getElementById('btn').disabled = false;
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls || '';
}
</script>
</body>
</html>
