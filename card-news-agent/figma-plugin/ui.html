<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
    font-size: 12px;
    background: #fff;
    color: #1e1e1e;
    padding: 16px;
  }
  h1 { font-size: 14px; font-weight: 700; margin-bottom: 16px; }
  .info {
    background: #f0f6ff;
    border: 1px solid #c7deff;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 12px;
    font-size: 11px;
    color: #1a5fb4;
  }
  .field { margin-bottom: 12px; }
  label { display: block; font-weight: 600; margin-bottom: 4px; color: #444; }
  select {
    width: 100%;
    padding: 7px 8px;
    border: 1px solid #d0d0d0;
    border-radius: 4px;
    font-size: 12px;
    background: #fafafa;
    outline: none;
  }
  select:focus { border-color: #18a0fb; }
  select:disabled { background: #f0f0f0; color: #aaa; }
  .btn {
    width: 100%;
    padding: 10px;
    margin-top: 4px;
    background: #18a0fb;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn:hover { background: #0d8de3; }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  #status {
    margin-top: 10px;
    font-size: 11px;
    color: #666;
    min-height: 16px;
    text-align: center;
  }
  #status.error { color: #e53e3e; }
  #status.ok { color: #38a169; }
</style>
</head>
<body>

<h1>카드뉴스 자동생성</h1>

<div class="info" id="page-info">현재 페이지 감지 중...</div>

<div class="field">
  <label>주제 선택</label>
  <select id="folder" disabled>
    <option value="">불러오는 중...</option>
  </select>
</div>

<button class="btn" id="btn" onclick="apply()" disabled>생성하기</button>
<div id="status"></div>

<script>
const SERVER = 'http://localhost:8000';
let currentChannel = '';

// Figma에서 현재 페이지 이름 수신
window.onmessage = async (event) => {
  const msg = event.data.pluginMessage;
  if (!msg || msg.type !== 'page-name') return;

  const pageName = msg.name;
  currentChannel = pageName;

  document.getElementById('page-info').textContent = `채널: ${pageName}`;
  await loadFolders(pageName);
};

async function loadFolders(channel) {
  const sel = document.getElementById('folder');
  const btn = document.getElementById('btn');

  try {
    const res = await fetch(`${SERVER}/rows?channel=${encodeURIComponent(channel)}`);
    if (!res.ok) throw new Error('시트 읽기 실패');
    const rows = await res.json();

    sel.innerHTML = '<option value="">주제 선택...</option>';
    rows.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r['폴더명'];
      opt.textContent = r['폴더명'];
      sel.appendChild(opt);
    });

    sel.disabled = false;
    sel.onchange = () => { btn.disabled = !sel.value; };
    setStatus('');
  } catch (e) {
    sel.innerHTML = `<option value="">서버 연결 실패</option>`;
    setStatus('python3 server.py 실행 확인', 'error');
  }
}

async function apply() {
  const folder = document.getElementById('folder').value;
  if (!folder || !currentChannel) return;

  const btn = document.getElementById('btn');
  btn.disabled = true;
  setStatus('시트에서 가져오는 중...');

  try {
    const res = await fetch(
      `${SERVER}/row?channel=${encodeURIComponent(currentChannel)}&folder=${encodeURIComponent(folder)}`
    );
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || '실패');
    }
    const data = await res.json();
    parent.postMessage({ pluginMessage: { type: 'fill-frames', data } }, '*');
    setStatus('적용 완료!', 'ok');
  } catch (e) {
    setStatus(`❌ ${e.message}`, 'error');
  } finally {
    btn.disabled = false;
  }
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls || '';
}
</script>
</body>
</html>
